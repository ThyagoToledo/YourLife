name: Gate de publicação da main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  require-master:
    name: Exigir origem master
    runs-on: ubuntu-latest
    steps:
      - name: Validar branch de origem
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE_BRANCH" != "master" ]; then
            echo "Pull requests para main devem sair da branch master."
            exit 1
          fi
          echo "Origem master confirmada."

