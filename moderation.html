<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Moderação · Your Life</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-100"><main class="mx-auto max-w-5xl p-6 md:p-10"><header class="mb-8 flex items-center justify-between gap-4"><div><p class="text-sm font-semibold uppercase tracking-[.2em] text-violet-400">Your Life</p><h1 class="mt-2 text-3xl font-bold">Central de moderação</h1><p class="mt-2 text-slate-400">Ações limitadas ao cargo e registradas em auditoria.</p></div><a href="site.html" class="rounded-lg border border-slate-700 px-4 py-2">Voltar</a></header><div id="message" class="mb-5 hidden rounded-lg border p-4"></div><div class="grid gap-6 lg:grid-cols-2"><section class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><h2 class="text-xl font-semibold">Denúncias pendentes</h2><div id="reports" class="mt-4 space-y-3"></div></section><form id="action-form" class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><h2 class="text-xl font-semibold">Aplicar ação</h2><select id="target-type" class="mt-4 w-full rounded-lg border border-slate-700 bg-slate-950 p-3"><option value="user">Usuário</option><option value="message">Mensagem</option><option value="post">Postagem</option><option value="comment">Comentário</option><option value="call">Ligação</option></select><input id="target-id" required class="mt-3 w-full rounded-lg border border-slate-700 bg-slate-950 p-3" placeholder="ID do alvo"><select id="action" class="mt-3 w-full rounded-lg border border-slate-700 bg-slate-950 p-3"><option value="warn">Advertir membro</option><option value="suspend">Suspender membro</option><option value="delete">Remover conteúdo</option><option value="close_call">Encerrar ligação</option></select><input id="hours" type="number" min="1" max="720" value="24" class="mt-3 w-full rounded-lg border border-slate-700 bg-slate-950 p-3" placeholder="Duração em horas"><textarea id="reason" required class="mt-3 min-h-28 w-full rounded-lg border border-slate-700 bg-slate-950 p-3" placeholder="Justificativa obrigatória"></textarea><button class="mt-3 rounded-lg bg-violet-600 px-4 py-2 font-semibold hover:bg-violet-500">Registrar ação</button></form></div></main><script>
const token=localStorage.getItem('authToken');const message=document.getElementById('message');function esc(v){const n=document.createElement('span');n.textContent=v??'';return n.innerHTML}function notice(t,e=false){message.textContent=t;message.className=`mb-5 rounded-lg border p-4 ${e?'border-red-800 bg-red-950':'border-emerald-800 bg-emerald-950'}`;message.classList.remove('hidden')}async function api(path,options={}){const response=await fetch(`/api${path}`,{...options,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:options.body?JSON.stringify(options.body):undefined});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Erro HTTP ${response.status}`);return data}async function load(){try{const reports=await api('/moderation/reports');document.getElementById('reports').innerHTML=reports.length?reports.map(r=>`<article class="rounded-lg border border-slate-700 p-3"><strong>${esc(r.targetType)} · ${esc(r.targetId)}</strong><p class="mt-2 text-sm text-slate-400">${esc(r.reason)}</p><button data-id="${esc(r.targetId)}" data-type="${esc(r.targetType)}" class="mt-2 text-violet-400">Selecionar</button></article>`).join(''):'<p class="text-slate-500">Nenhuma denúncia pendente.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('target-id').value=b.dataset.id;document.getElementById('target-type').value=b.dataset.type}))}catch(error){notice(error.message,true)}}document.getElementById('action-form').addEventListener('submit',async e=>{e.preventDefault();try{await api('/moderation/actions',{method:'POST',body:{targetType:document.getElementById('target-type').value,targetId:document.getElementById('target-id').value,action:document.getElementById('action').value,durationHours:Number(document.getElementById('hours').value),reason:document.getElementById('reason').value}});notice('Ação aplicada e auditada.');e.target.reset();await load()}catch(error){notice(error.message,true)}});load();
</script></body></html>
